name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all" .'

  deploy:
    name: Deploy to PPH
    needs: [check, secrets]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
      url: https://bento.cat
    concurrency:
      group: bento-production
      cancel-in-progress: false
    steps:
      - name: Deploy the checked commit
        env:
          DEPLOY_KEY: ${{ secrets.PPH_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PPH_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/bento-deploy-key"
          hosts_file="$RUNNER_TEMP/bento-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            bento-deploy@212.87.214.144 "deploy $DEPLOY_SHA"
